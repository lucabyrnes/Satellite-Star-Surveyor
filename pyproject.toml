[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mpc-spacecraft"
version = "0.1.0"
description = "Model Predictive Control for Spacecraft Attitude"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pandas>=3.0.6",
    "numpy-quaternion>=2024.0.13",
    "drake>=1.58.0",
    "astropy>=8.0.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.11.2",
    "ursina>=8.3.0",
    "skyfield>=1.55",
]
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "notebook>=7.6.3",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "matplotlib>=3.11.2",
    "ursina>=8.3.0",
    "skyfield>=1.55",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "notebook>=7.6.3",
]

[tool.hatch.build.targets.wheel.shared-data]
"mpc_spacecraft.config" = "src/mpc_spacecraft/config"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc_spacecraft"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
    "experiments/**/*.py",
]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.ipynb_checkpoints/**",
    "notebooks/**",
]
search-path = ["src", "typings"]
python-version = "3.12"
python-platform = "linux"
